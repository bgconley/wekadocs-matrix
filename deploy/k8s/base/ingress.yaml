apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nutanixdocs-ingress
  namespace: nutanixdocs
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - nutanixdocs.example.com
    secretName: nutanixdocs-tls
  rules:
  - host: nutanixdocs.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mcp-server
            port:
              number: 8000
