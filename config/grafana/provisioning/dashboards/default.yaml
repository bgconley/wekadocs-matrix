# Dashboard provisioning configuration for Nutanix Docs-Matrix LGTM stack
# This file tells Grafana where to find dashboard JSON files

apiVersion: 1

providers:
  - name: 'Nutanix Docs Dashboards'
    orgId: 1
    folder: 'Nutanix Docs'
    folderUid: 'nutanixdocs'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
